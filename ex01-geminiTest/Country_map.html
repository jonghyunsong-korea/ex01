<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive World Map - 100 Countries</title>
    
    <!-- Tailwind CSS 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- D3.js 로드 (지도 시각화용) -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    
    <!-- Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome (아이콘용) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* Tailwind gray-100 */
            margin: 0;
            overflow: hidden; /* 전체 화면 스크롤 방지 */
        }

        /* D3 Map SVG 스타일 */
        #map-svg {
            width: 100%;
            height: 100%;
            cursor: grab;
        }
        #map-svg:active {
            cursor: grabbing;
        }

        /* 국가 Path 스타일 */
        .country {
            transition: fill 0.2s ease, stroke-width 0.2s ease;
            outline: none;
        }
        .country.active-hover {
            fill: #3b82f6; /* hover 시 파란색 */
            cursor: pointer;
        }
        .country.selected {
            fill: #2563eb !important; /* 선택 시 진한 파란색 */
            stroke: #ffffff;
            stroke-width: 1.5px;
        }

        /* D3 툴팁 스타일 */
        #tooltip {
            position: absolute;
            opacity: 0;
            background: rgba(17, 24, 39, 0.9); /* gray-900 */
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            pointer-events: none;
            font-size: 0.875rem;
            font-weight: 600;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: opacity 0.2s ease;
            z-index: 50;
            white-space: nowrap;
        }

        /* 정보 패널 트랜지션 */
        .fade-in {
            animation: fadeIn 0.4s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 스크롤바 커스텀 (정보 패널용) */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col md:flex-row">

        </div>

        <!-- 국가 정보 표시 화면 (초기엔 숨김) -->

                        <i class="fa-solid fa-building-columns"></i>
                    </div>
                    <span class="text-xs text-gray-500 font-semibold mb-1">수도 (Capital)</span>

        for (const [iso3, data] of Object.entries(countryDataRaw)) {
            countryDB[iso3] = {
                ko: data[0],
                en: data[1],
                capital: data[2],
                flower: data[3],
                iso2: data[4],
            };
        }

        const mapContainer = document.getElementById('map-container');
        const width = mapContainer.clientWidth;
        const height = mapContainer.clientHeight;

        const svg = d3.select("#map-container")
            .append("svg")
            .attr("id", "map-svg")
            .attr("viewBox", `0 0 ${width} ${height}`)
            .attr("preserveAspectRatio", "xMidYMid meet");

        // 메르카토르 투영법 설정 (세계 지도 표준)
        const projection = d3.geoMercator()
            .scale(width / 6.5) // 화면 크기에 비례한 스케일
            .translate([width / 2, height / 1.5]);

        const path = d3.geoPath().projection(projection);
        
        // 줌 및 드래그 이벤트 설정를 위한 g 태그 생성
        const g = svg.append("g");

        const zoom = d3.zoom()
            .scaleExtent([1, 8]) // 최소 1배, 최대 8배 확대
            .on("zoom", (event) => {
                g.attr("transform", event.transform);
            });
        
        svg.call(zoom);

        // 툴팁 요소 선택
        const tooltip = d3.select("#tooltip");
        let activeCountry = null; // 현재 선택된 국가를 추적

        // 가벼운 세계 지도 TopoJSON/GeoJSON URL (110m 해상도)
        const geoDataUrl = "https://raw.githubusercontent.com/holtzy/D3-graph-gallery/master/DATA/world.geojson";

        d3.json(geoDataUrl).then(function(data) {
            
            g.selectAll("path")
                .data(data.features)
                .enter()
                .append("path")
                .attr("class", "country")
                .attr("d", path)
                // DB에 있는 100개 국가는 에메랄드색, 없는 국가는 옅은 회색으로 칠함
                .attr("fill", d => countryDB[d.id] ? "#6ee7b7" : "#e5e7eb")
                .attr("stroke", "#ffffff")
                .attr("stroke-width", 0.5)
                
                .on("mouseover", function(event, d) {
                    // 데이터가 있는 100개 국가만 호버 이벤트 활성화
                    if (countryDB[d.id]) {
                        if (activeCountry !== this) {
                            d3.select(this).classed("active-hover", true);
                        }
                        
                        // 툴팁 위치 및 내용 설정
                        tooltip.html(`
                            <div class="flex items-center gap-2">
                                <img src="https://flagcdn.com/w20/${countryDB[d.id].iso2}.png" alt="flag" class="w-4 h-3 rounded-sm object-cover">
                                <span>${countryDB[d.id].ko}</span>
                            </div>
                        `)
                        .style("left", (event.pageX + 15) + "px")
                        .style("top", (event.pageY + 15) + "px")
                        .style("opacity", 1);
                    }
                })
                .on("mousemove", function(event) {
                    tooltip.style("left", (event.pageX + 15) + "px")
                           .style("top", (event.pageY + 15) + "px");
                })
                .on("mouseout", function(event, d) {
                    d3.select(this).classed("active-hover", false);
                    tooltip.style("opacity", 0);
                })
                .on("click", function(event, d) {
                    if (countryDB[d.id]) {
                        // 기존 선택 해제
                        if (activeCountry) {
                            d3.select(activeCountry).classed("selected", false);
                        }
                        // 현재 클릭한 국가 선택 상태로 변경
                        activeCountry = this;
                        d3.select(this).classed("selected", true);
                        
                        // 패널 업데이트 함수 호출
                        updateInfoPanel(countryDB[d.id]);
                    }
                });
        }).catch(error => {
            console.error("Map data loading error:", error);
            document.getElementById('default-panel').innerHTML = "<p class='text-red-500'>지도 데이터를 불러오는 중 오류가 발생했습니다.</p>";
        });

        // 우측 패널 정보 업데이트 함수
        function updateInfoPanel(country) {
            // 패널 전환 (Default -> Info)
            document.getElementById('default-panel').classList.add('hidden');
            const infoPanel = document.getElementById('info-panel');
            infoPanel.classList.remove('hidden');
            
            // 애니메이션 리셋을 위한 꼼수 (재생을 위해 클래스 제거 후 다시 추가)
            infoPanel.classList.remove('fade-in');
            void infoPanel.offsetWidth; // DOM Reflow 강제 발생
            infoPanel.classList.add('fade-in');

            // 텍스트 및 국기 데이터 채우기
            document.getElementById('country-name').textContent = country.ko;
            document.getElementById('country-en-name').textContent = country.en;
            document.getElementById('country-capital').textContent = country.capital;
            document.getElementById('country-flower').textContent = country.flower;
            
            // 국기 이미지 로드 (FlagCDN 사용 - 매우 안정적임)
            document.getElementById('country-flag').src = `https://flagcdn.com/w320/${country.iso2}.png`;
            
            // 관련 풍경 이미지 로드
            // picsum.photos의 seed 기능을 사용하여 국가 영문명을 시드로 한 랜덤 풍경 이미지를 고정적으로 가져옴
            const imageEl = document.getElementById('country-image');
            const loader = document.getElementById('image-loader');
            
            // 로딩 스피너 표시, 이미지 투명하게
            loader.style.display = 'flex';
            imageEl.style.opacity = '0';
            
            // URL 갱신
            // seed 뒤에 국가명을 넣어 해당 국가 클릭시마다 항상 같은 풍경이 나오도록 설정
            imageEl.src = `https://picsum.photos/seed/${country.en.replace(/\s+/g, '')}Landscape/600/400`;
        }

        // 창 크기 변경 시 지도 크기 재설정 로직 (반응형)
        window.addEventListener('resize', () => {
            const newWidth = mapContainer.clientWidth;
            const newHeight = mapContainer.clientHeight;
            svg.attr("viewBox", `0 0 ${newWidth} ${newHeight}`);
        });

    </script>
</body>
</html>
