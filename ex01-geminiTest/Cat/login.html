<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - MintCat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="logo">
            <a href="index.html">🐱 MintCat</a>
        </div>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">홈</a></li>
                <li><a href="board.html">고양이 게시판</a></li>
            </ul>
        </nav>
        <div class="auth-links">
            <a href="login.html">로그인</a>
        </div>
    </header>

    <main class="container">
        <div class="form-container">
            <h2 class="form-title">로그인</h2>
            <form action="#" method="get" onsubmit="event.preventDefault(); alert('테스트 로그인 성공!'); window.location.href='index.html';">
                <div class="form-group">
                    <label for="username">아이디</label>
                    <input type="text" id="username" name="username" required placeholder="아이디를 입력하세요">
                </div>
                <div class="form-group">
                    <label for="password">비밀번호</label>
                    <input type="password" id="password" name="password" required placeholder="비밀번호를 입력하세요">
                </div>
                <button type="submit" class="btn-submit">로그인</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 MintCat. All rights reserved.</p>
    </footer>
</body>
</html>
