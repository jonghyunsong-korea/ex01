<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일정 메모 앱</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #3b82f6 0%, #6366f1 45%, #8b5cf6 100%);
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.15);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.4);
            border-radius: 999px;
        }

        .checkbox-custom {
            appearance: none;
            width: 1.15rem;
            height: 1.15rem;
            border: 2px solid #cbd5e1;
            border-radius: 0.35rem;
            display: grid;
            place-items: center;
            cursor: pointer;
            transition: background-color 150ms ease;
        }

        .checkbox-custom:checked {
            background-color: #2563eb;
            border-color: #2563eb;
        }

        .checkbox-custom:checked::before {
            content: '\2713';
            color: white;
            font-size: 0.85rem;
        }
    </style>
</head>
<body class="flex items-center justify-center py-10 px-4">
    <div class="w-full max-w-3xl bg-white/90 backdrop-blur-xl rounded-3xl shadow-2xl border border-white/30 p-8">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-extrabold text-slate-900 mb-2">일정 메모 앱</h1>
            <p class="text-slate-600">오늘의 일정이나 내일을 간단하게 기록해보세요.</p>
        </div>

        <div class="grid gap-4 sm:grid-cols-[1fr_auto] mb-4">
            <div class="grid gap-3 sm:grid-cols-2">
                <input id="memo-date" type="date" class="px-4 py-3 border rounded-2xl text-slate-700 focus:border-sky-500 focus:ring-2 focus:ring-sky-100 outline-none" />
                <input id="memo-time" type="time" class="px-4 py-3 border rounded-2xl text-slate-700 focus:border-sky-500 focus:ring-2 focus:ring-sky-100 outline-none" />
            </div>
            <button id="btn-add" class="w-full sm:w-auto bg-sky-600 hover:bg-sky-700 text-white font-semibold px-6 py-3 rounded-2xl transition">일정 추가</button>
        </div>

        <textarea id="memo-text" rows="4" placeholder="메모 내용을 입력하세요..." class="w-full px-4 py-4 border rounded-3xl text-slate-700 focus:border-sky-500 focus:ring-2 focus:ring-sky-100 outline-none resize-none"></textarea>

        <div class="flex flex-col sm:flex-row items-center justify-between gap-3 mt-5">
            <p class="text-slate-700 font-medium">저장된 일정: <span id="memo-count">0</span></p>
            <button id="btn-clear-all" class="bg-slate-500 hover:bg-slate-600 text-white px-5 py-3 rounded-2xl transition">전체 삭제</button>
        </div>

        <ul id="memo-list" class="mt-6 space-y-4"></ul>
    </div>

    <script>
        const memoDate = document.getElementById('memo-date');
        const memoTime = document.getElementById('memo-time');
        const memoText = document.getElementById('memo-text');
        const memoList = document.getElementById('memo-list');
        const memoCount = document.getElementById('memo-count');
        const btnAdd = document.getElementById('btn-add');
        const btnClearAll = document.getElementById('btn-clear-all');

        const STORAGE_KEY = 'scheduleMemoAppData';

        let memos = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

        function formatDate(dateString) {
            if (!dateString) return '날짜 없음';
            const [year, month, day] = dateString.split('-');
            return `${year}.${month}.${day}`;
        }

        function renderMemos() {
            memoList.innerHTML = '';
            memoCount.textContent = memos.length;

            if (memos.length === 0) {
                memoList.innerHTML = '<li class="text-center text-slate-500 py-10">등록된 일정이 없습니다.</li>';
                return;
            }

            memos.forEach(memo => {
                const item = document.createElement('li');
                item.className = 'bg-slate-50 border border-slate-200 rounded-3xl p-5 shadow-sm';
                item.innerHTML = `
                    <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-3">
                        <div>
                            <p class="text-slate-900 font-semibold text-lg">${memo.title}</p>
                            <p class="text-slate-500 mt-1 text-sm">${formatDate(memo.date)} ${memo.time || ''}</p>
                        </div>
                        <button class="delete-btn text-slate-400 hover:text-red-500 transition">삭제</button>
                    </div>
                    <p class="mt-4 text-slate-700 whitespace-pre-line">${memo.text}</p>
                `;

                item.querySelector('.delete-btn').addEventListener('click', () => {
                    deleteMemo(memo.id);
                });

                memoList.appendChild(item);
            });
        }

        function saveMemos() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(memos));
        }

        function addMemo() {
            const date = memoDate.value;
            const time = memoTime.value;
            const text = memoText.value.trim();
            if (!text) {
                memoText.focus();
                return;
            }

            const newMemo = {
                id: Date.now(),
                date: date,
                time: time,
                text: text,
                title: date ? `일정 (${formatDate(date)} ${time || ''})` : '일정'
            };

            memos.unshift(newMemo);
            saveMemos();
            renderMemos();
            memoText.value = '';
            memoTime.value = '';
        }

        function deleteMemo(id) {
            memos = memos.filter(item => item.id !== id);
            saveMemos();
            renderMemos();
        }

        btnAdd.addEventListener('click', addMemo);
        btnClearAll.addEventListener('click', () => {
            memos = [];
            saveMemos();
            renderMemos();
        });

        memoText.addEventListener('keypress', event => {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                addMemo();
            }
        });

        const today = new Date().toISOString().slice(0, 10);
        memoDate.value = today;

        renderMemos();
    </script>
</body>
</html>
